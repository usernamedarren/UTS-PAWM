<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin • Brocode Barbershop</title>
  <link rel="stylesheet" href="/styles/admin.css">
</head>
<body>

  <div class="page-loader" id="loader">
    <div class="spinner"></div>
  </div>

  <div class="header">
    <img src="/logo.png" alt="Brocode" onerror="this.style.display='none'">
    <button class="logout" id="logout-btn">LOGOUT</button>
  </div>

  <div class="container">
    <h1>RESERVASI PELANGGAN</h1>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty-state" style="display:none;">
      <h2>Belum Ada Reservasi</h2>
      <p>Tunggu pelanggan mulai booking ya bro!</p>
    </div>
  </div>

  <div class="trash" id="trash" title="Drag kartu ke sini untuk menghapus">
    <div class="trash-icon">
      <div class="trash-lid"></div>
      <div class="trash-body">
        <div class="trash-line"></div>
        <div class="trash-line"></div>
        <div class="trash-line"></div>
      </div>
    </div>
  </div>

  <script src="/scripts/admin.js"></script>
</body>
</html>
