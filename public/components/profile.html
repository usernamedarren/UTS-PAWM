<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profil • Brocode Barbershop</title>
  <link rel="stylesheet" href="/styles/profile.css" />
</head>
<body>
  <div class="header">
    <a href="/index.html" class="home-btn" title="Kembali ke Home">
      <img src="/logo.png" alt="Brocode" onerror="this.style.display='none'">
    </a>
    <div class="header-actions">
      <button id="home-btn" class="home-btn small">HOME</button>
      <button id="logout-btn" class="logout">LOGOUT</button>
    </div>
  </div>
  <div class="container">
    <h1>RESERVASI SAYA</h1>
    <div id="loading" class="loading">Memuat data...</div>
    <div id="filters" class="filters" hidden>
      <select id="statusFilter">
        <option value="all">Semua Status</option>
        <option value="approved">Disetujui</option>
        <option value="not approved">Tidak Disetujui</option>
        <option value="pending">Menunggu</option>
      </select>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty-state" style="display:none;">
      <h2>Belum Ada Reservasi</h2>
      <p>Kamu belum punya reservasi, bro!</p>
    </div>
  </div>
  <script src="/scripts/profile.js" defer></script>
  <script>
    // Fallback HOME button if anchor doesn't resolve
    document.getElementById('home-btn')?.addEventListener('click', ()=>{
      window.location.href = '/';
    });
  </script>
</body>
</html>
