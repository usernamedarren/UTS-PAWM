<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profil • Brocode Barbershop</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <style>
    :root {
      --bg: #f5f5f5;
      --card: #DEC7A6;
      --text: #333;
      --accent: #DEC7A6;
      --green: #5cb85c;
      --red: #dc3545;
      --dark: #1A1A1A;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Arial, sans-serif; background: var(--bg); color: var(--text); }
    .header { background: var(--dark); color:#fff; padding: 1rem 2rem; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10; box-shadow:0 2px 10px rgba(0,0,0,.3); }
    .header img { height:42px; }
    .header .right { display:flex; gap:12px; align-items:center; }
    .btn { text-decoration:none; cursor:pointer; border:3px solid var(--accent); background: var(--dark); color: var(--accent); padding:12px 28px; font-weight:900; border-radius:8px; text-transform:uppercase; font-size:.9rem; letter-spacing:.5px; box-shadow:0 4px 0 #000; transition:.25s; display:inline-flex; align-items:center; gap:6px; }
    .btn:hover { background:var(--accent); color:var(--dark); }
    .logout { border-color: var(--red); color: var(--red); }
    .logout:hover { background: var(--red); color:#fff; }
    .container { max-width:1200px; margin:0 auto; padding:32px 20px 120px; }
    h1 { text-align:center; margin:10px 0 30px; font-size:2.1rem; letter-spacing:1px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:24px; }
    .card { background:var(--card); padding:20px 18px 22px; border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,.18); display:flex; flex-direction:column; position:relative; overflow:hidden; }
    .card:before { content:""; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,0.15),rgba(0,0,0,0)); pointer-events:none; }
    .card h3 { margin:0 0 12px; font-size:1.15rem; font-weight:800; border-bottom:2px solid rgba(0,0,0,.3); padding-bottom:6px; display:flex; align-items:center; gap:6px; }
    .card h3 span.tag { background:var(--dark); color:var(--accent); padding:2px 8px; border-radius:4px; font-size:.65rem; letter-spacing:.5px; }
    .meta { margin:4px 0; font-size:.9rem; line-height:1.4; }
    .meta strong { display:inline-block; min-width:82px; }
    .status { margin-top:auto; padding:10px 12px; border-radius:8px; font-weight:700; font-size:.85rem; letter-spacing:.5px; text-align:center; color:#fff; }
    .status.pending { background:#777; }
    .status.accepted { background:var(--green); }
    .status.rejected { background:var(--red); }
    .empty { text-align:center; padding:80px 20px; color:#777; }
    .empty h2 { margin:0 0 10px; font-size:1.9rem; }
    .actions { text-align:center; margin-top:30px; }
    .fade-in { opacity:0; transform:translateY(10px); animation:fade .5s forwards; }
    @keyframes fade { to { opacity:1; transform:none; } }
    @media (max-width: 680px){ .header { padding: .8rem 1rem; } .btn { padding:10px 20px; font-size:.75rem; } h1 { font-size:1.7rem; } }
  </style>
</head>
<body>
  <header class="header">
    <a href="/" class="logo-link"><img src="/logo.png" alt="Brocode" onerror="this.style.display='none'"></a>
    <div class="right">
      <a class="btn" href="/">HOME</a>
      <button id="logout-btn" class="btn logout">LOGOUT</button>
    </div>
  </header>

  <div class="container">
    <h1>Reservasi Saya</h1>
    <div id="empty" class="empty" style="display:none;">
      <h2>Belum Ada Reservasi</h2>
      <p>Kamu belum pernah membuat reservasi.</p>
      <div class="actions"><a class="btn" href="/#book">Buat Reservasi</a></div>
    </div>
    <div id="grid" class="grid"></div>
  </div>

  <script>
    // Auth check (new flags)
    const isUser = localStorage.getItem('brocode_user_logged') === 'true';
    const isAdmin = localStorage.getItem('brocode_admin_logged') === 'true';
    const email = localStorage.getItem('brocode_user_email');
    if (!isUser || isAdmin || !email){
      alert('Silakan login sebagai pengguna untuk melihat profil.');
      window.location.href = '/';
    }

    // For now we only show local temporary bookings stored in localStorage (placeholder until API filtering implemented)
    let myBookings = [];
    async function loadBookings(){
      try {
        const resp = await fetch('/api/appointments');
        const body = await resp.json();
        if(!resp.ok) throw new Error(body.error||'Gagal memuat reservasi');
        const all = Array.isArray(body.data)? body.data : [];
        myBookings = all.filter(b => b.email === email);
        render();
      } catch(err){
        console.error('Load bookings error', err.message);
        // fallback local cache
        const allLocal = JSON.parse(localStorage.getItem('brocode_bookings')||'[]');
        myBookings = allLocal.filter(b => b.email === email);
        render();
      }
    }

    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');

    function statusClass(s){ if(!s) return 'pending'; s = s.toLowerCase(); if (s.startsWith('acc')||s==='approved'||s==='accepted') return 'accepted'; if (s.startsWith('rej')||s==='declined') return 'rejected'; return 'pending'; }
    function statusLabel(s){ if(!s) return 'MENUNGGU'; s = s.toLowerCase(); if (s.startsWith('acc')||s==='approved'||s==='accepted') return 'DITERIMA'; if (s.startsWith('rej')||s==='declined') return 'DITOLAK'; return 'MENUNGGU'; }

    function render(){
      grid.innerHTML='';
      if (!myBookings.length){ empty.style.display='block'; return; }
      empty.style.display='none';
      myBookings.forEach((b,i)=>{
        const card=document.createElement('div');
        card.className='card fade-in';
        const date = b.date || b.datetime || '-';
        const time = b.time || '-';
        card.innerHTML=`\n          <h3>${date} <span style="font-weight:400;">${time}</span></h3>\n          <p class='meta'><strong>Layanan:</strong> ${escapeHtml(b.service||'-')}</p>\n          <p class='meta'><strong>Capster:</strong> ${escapeHtml(b.capster||b.capsterName||'-')}</p>\n          ${b.phone?`<p class='meta'><strong>Telp:</strong> ${escapeHtml(b.phone)}</p>`:''}\n          ${b.message?`<p class='meta'><strong>Catatan:</strong> ${escapeHtml(b.message)}</p>`:''}\n          <div class='status ${statusClass(b.status)}'>${statusLabel(b.status)}</div>\n        `;
        grid.appendChild(card);
      });
    }

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

    document.getElementById('logout-btn').addEventListener('click', ()=>{
      if (confirm('Yakin ingin logout?')){
        localStorage.removeItem('brocode_user_logged');
        localStorage.removeItem('brocode_user_email');
        window.location.href='/';
      }
    });

  loadBookings();
  </script>
</body>
</html>
